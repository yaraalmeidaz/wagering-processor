name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run guards

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test

  # PostgreSQL e LocalStack reais em service containers (AGENTS.md seção 6; ADR-0010).
  integration:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_USER: wagering
          # Container efêmero do runner: autenticação trust, sem senha versionada (CLAUDE.md regra 5).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # LocalStack real (ADR-0010). O token vem do secret do repositório, nunca de arquivo versionado.
      localstack:
        image: localstack/localstack:2026.10.7
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        ports:
          - 4566:4566
        options: >-
          --health-cmd "awslocal sqs list-queues"
          --health-interval 5s
          --health-timeout 15s
          --health-retries 30
          --health-start-period 30s
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      # Ignorada pela autenticação trust; existe porque o mikro-orm.config.ts exige a variável.
      POSTGRES_PASSWORD: ${{ github.run_id }}
      SQS_ENDPOINT: http://127.0.0.1:4566
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  # Testes com 3 ou mais processos Bun reais (invariante 9 do AGENTS.md), contra PostgreSQL e LocalStack reais.
  concurrency:
    needs: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_USER: wagering
          # Container efêmero do runner: autenticação trust, sem senha versionada (CLAUDE.md regra 5).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # LocalStack real (ADR-0010). O token vem do secret do repositório, nunca de arquivo versionado.
      localstack:
        image: localstack/localstack:2026.10.7
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        ports:
          - 4566:4566
        options: >-
          --health-cmd "awslocal sqs list-queues"
          --health-interval 5s
          --health-timeout 15s
          --health-retries 30
          --health-start-period 30s
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      # Ignorada pela autenticação trust; existe porque o mikro-orm.config.ts exige a variável.
      POSTGRES_PASSWORD: ${{ github.run_id }}
      SQS_ENDPOINT: http://127.0.0.1:4566
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:concurrency
